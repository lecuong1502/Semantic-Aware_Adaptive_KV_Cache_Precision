[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "microinfer"
version = "0.0.1"
description = "Semantic-aware adaptive KV cache precision for single-user LLM inference under VRAM contention"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26"]

# PyTorch is deliberately absent, and must stay absent. ADR-0002: its caching
# allocator retains freed device memory, so NVML would report that reservation
# as used memory, indistinguishable from the external contention this project
# exists to measure. It belongs only in the offline golden tensor generator,
# which runs in a separate environment.
[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
wheel.packages = ["src/microinfer"]
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
